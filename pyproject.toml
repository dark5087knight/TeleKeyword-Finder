[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tgagent"
version = "0.1.0"
description = "Agent-Based Telegram Post Discovery & Orchestration System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TeleKeyword Finder Team" }
]
dependencies = [
    "telethon>=1.35.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

